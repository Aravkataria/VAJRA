name: Test macOS (Interactive & Automated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode'
        required: true
        default: 'interactive-web-terminal'
        type: choice
        options:
          - 'interactive-web-terminal'
          - 'automated-test-suite'

jobs:
  test-mac:
    name: Apple Silicon macOS Runner
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Automated test mode
      - name: Run Automated Installer & Pytest
        if: ${{ inputs.mode == 'automated-test-suite' }}
        run: |
          echo "=== Running scripts/install.sh on macOS ==="
          bash scripts/install.sh
          echo "=== Testing Python Pytest Suite ==="
          pip install -r requirements.txt pytest httpx httpx2
          python -m pytest

      # Interactive mode: Huge prominent URL printed directly in logs
      - name: 🚀 OPEN LIVE MAC TERMINAL (CLICK LINK BELOW)
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        run: |
          echo "=== Installing tmate ==="
          brew install tmate >/dev/null 2>&1 || brew install tmate
          
          echo "=== Generating Web Terminal Session ==="
          tmate -S /tmp/tmate.sock new-session -d
          
          WEB_URL=""
          for i in $(seq 1 30); do
            WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || true)
            if [[ "$WEB_URL" == https* ]]; then
              break
            fi
            sleep 1
          done
          
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
          
          echo ""
          echo "################################################################################"
          echo "################################################################################"
          echo "##"
          echo "##   👉 DIRECT LINK TO OPEN MAC TERMINAL IN YOUR BROWSER:"
          echo "##"
          echo "##   $WEB_URL"
          echo "##"
          echo "##   (SSH Command: $SSH_CMD)"
          echo "##"
          echo "################################################################################"
          echo "################################################################################"
          echo ""
          
          # Keep terminal alive for 30 minutes
          for i in $(seq 1 360); do
            if [ ! -S /tmp/tmate.sock ]; then break; fi
            sleep 5
          done
