name: Test macOS (Interactive & Automated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode'
        required: true
        default: 'automated-test-suite'
        type: choice
        options:
          - 'automated-test-suite'
          - 'interactive-web-terminal'

jobs:
  test-mac:
    name: Apple Silicon macOS Runner (${{ inputs.mode }})
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Automated test mode: Installs & runs test suite automatically
      - name: Run Automated Installer & Pytest
        if: ${{ inputs.mode == 'automated-test-suite' }}
        run: |
          echo "=== Running scripts/install.sh on macOS ==="
          bash scripts/install.sh
          echo "=== Testing Python Pytest Suite ==="
          pip install -r requirements.txt pytest
          python -m pytest

      # Interactive mode: Pure native tmate web terminal (0 SSH keys needed)
      - name: Launch Live Web Terminal
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        run: |
          echo "=== Installing tmate ==="
          brew install tmate
          
          echo "=== Starting tmate session ==="
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo ""
          echo "================================================================"
          echo "  🎉 LIVE WEB TERMINAL IS READY!"
          echo "  Click or open this URL in your browser to access the macOS terminal:"
          echo ""
          echo "  👉 $WEB_URL"
          echo ""
          echo "  (Or SSH: $SSH_CMD)"
          echo "================================================================"
          echo ""
          
          # Keep terminal alive for interactive use
          while [ -S /tmp/tmate.sock ]; do
            sleep 5
          done
