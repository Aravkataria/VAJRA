name: Test macOS (Interactive & Automated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode'
        required: true
        default: 'interactive-web-terminal'
        type: choice
        options:
          - 'interactive-web-terminal'
          - 'automated-test-suite'

jobs:
  test-mac:
    name: Apple Silicon macOS Runner
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Automated test mode
      - name: Run Automated Installer & Pytest
        if: ${{ inputs.mode == 'automated-test-suite' }}
        run: |
          echo "=== Running scripts/install.sh on macOS ==="
          bash scripts/install.sh
          echo "=== Testing Python Pytest Suite ==="
          pip install -r requirements.txt pytest httpx httpx2
          python -m pytest

      # Interactive mode: Foreground mode streams link directly to console
      - name: 🚀 OPEN LIVE MAC TERMINAL
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        run: |
          echo "=== Installing tmate ==="
          brew install tmate >/dev/null 2>&1 || true
          
          echo ""
          echo "================================================================"
          echo "  CONNECTING TO TMATE... (URL WILL APPEAR BELOW IN 2 SECONDS)  "
          echo "================================================================"
          echo ""
          
          # tmate -F runs in foreground and prints web & ssh URLs directly!
          tmate -F
