name: Test macOS (Interactive & Automated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode'
        required: true
        default: 'interactive-web-terminal'
        type: choice
        options:
          - 'interactive-web-terminal'
          - 'automated-test-suite'

jobs:
  test-mac:
    name: Apple Silicon macOS Runner
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Automated test mode
      - name: Run Automated Installer & Pytest
        if: ${{ inputs.mode == 'automated-test-suite' }}
        run: |
          echo "=== Running scripts/install.sh on macOS ==="
          bash scripts/install.sh
          echo "=== Testing Python Pytest Suite ==="
          pip install -r requirements.txt pytest httpx httpx2
          python -m pytest

      # Interactive mode: Pins link to the very top banner of the GitHub Actions page
      - name: Launch Live Web Terminal
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        run: |
          echo "=== Installing tmate ==="
          brew install tmate
          
          echo "=== Starting tmate session ==="
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          # 1. PINS A BIG NOTIFICATION BANNER AT THE VERY TOP OF GITHUB ACTIONS
          echo "::notice title=👉 CLICK HERE TO OPEN MAC TERMINAL::$WEB_URL"
          
          # 2. Writes a huge clickable link on the Summary page
          echo "# 🖥️ LIVE MACOS TERMINAL READY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 👉 [CLICK HERE TO OPEN TERMINAL IN YOUR BROWSER]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Direct link: $WEB_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SSH Command: \`$SSH_CMD\`" >> $GITHUB_STEP_SUMMARY
          
          echo ""
          echo "****************************************************************"
          echo "  LINK TO OPEN IN BROWSER:"
          echo "  $WEB_URL"
          echo "****************************************************************"
          echo ""
          
          # Keep terminal alive for 30 minutes
          for i in $(seq 1 360); do
            if [ ! -S /tmp/tmate.sock ]; then break; fi
            sleep 5
          done
