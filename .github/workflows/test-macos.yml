name: Test macOS (Interactive & Automated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode'
        required: true
        default: 'interactive-web-terminal'
        type: choice
        options:
          - 'interactive-web-terminal'
          - 'automated-test-suite'

jobs:
  test-mac:
    name: Apple Silicon macOS Runner
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Automated test mode
      - name: Run Automated Installer & Pytest
        if: ${{ inputs.mode == 'automated-test-suite' }}
        run: |
          echo "=== Running scripts/install.sh on macOS ==="
          bash scripts/install.sh
          echo "=== Testing Python Pytest Suite ==="
          pip install -r requirements.txt pytest httpx httpx2
          python -m pytest

      # Interactive mode: ttyd + Cloudflare HTTPS Tunnel
      - name: 🚀 OPEN LIVE MAC TERMINAL
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        run: |
          echo "=== [1/2] Installing ttyd & Cloudflared via Homebrew ==="
          brew install ttyd cloudflared >/dev/null 2>&1 || brew install ttyd cloudflared
          
          echo "=== [2/2] Launching Web Terminal & HTTPS Tunnel ==="
          ttyd -p 7681 -W -t fontSize=14 bash >/dev/null 2>&1 &
          
          cloudflared tunnel --url http://127.0.0.1:7681 > /tmp/cf.log 2>&1 &
          
          CF_URL=""
          for i in $(seq 1 30); do
            CF_URL=$(grep -o 'https://[-a-z0-9.]*\.trycloudflare\.com' /tmp/cf.log | head -n 1 || true)
            if [ -n "$CF_URL" ]; then break; fi
            sleep 1
          done
          
          echo ""
          echo "################################################################################"
          echo "################################################################################"
          echo "##"
          echo "##   🎉 YOUR LIVE MACOS BROWSER TERMINAL IS READY!"
          echo "##"
          echo "##   👉 CLICK THIS LINK TO OPEN IN BROWSER:"
          echo "##"
          echo "##   $CF_URL"
          echo "##"
          echo "################################################################################"
          echo "################################################################################"
          echo ""
          
          # Keep session alive for 30 minutes
          for i in $(seq 1 360); do
            sleep 5
          done
