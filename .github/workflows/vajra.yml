name: VAJRA

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  statuses: write
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Run on PRs, or if someone mentions @vajra in a PR comment
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@vajra'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ Run VAJRA Security Auditor
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_critical: 'false'
