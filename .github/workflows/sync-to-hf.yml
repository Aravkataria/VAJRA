name: Sync to Hugging Face Space

on:
  push:
    branches: [ main ]
    paths:
      - 'hf_space/**'
      - 'hf_zerogpu_space/**'
      - '.github/workflows/sync-to-hf.yml'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload Spaces to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          if not token:
              print('::error::HF_TOKEN secret not found! Please add HF_TOKEN to your GitHub repository secrets.')
              exit(1)

          api = HfApi(token=token)

          # 1. Sync 2 vCPU Primary Space (VAJRA_v2)
          print('Uploading hf_space contents to AravKataria/VAJRA_v2 Space (2 vCPU)...')
          try:
              api.upload_folder(
                  folder_path='hf_space',
                  repo_id='AravKataria/VAJRA_v2',
                  repo_type='space',
                  commit_message='Automated sync: 2 vCPU engine with python_version 3.10 and audioop-lts'
              )
              print('✅ AravKataria/VAJRA_v2 updated successfully!')
          except Exception as e:
              print(f'⚠️ Error updating VAJRA_v2: {e}')

          # 2. Sync ZeroGPU Turbo Burst Space (vajra)
          print('Uploading hf_zerogpu_space contents to AravKataria/vajra Space (ZeroGPU)...')
          try:
              # Remove legacy Dockerfile so Hugging Face uses native Gradio ZeroGPU SDK
              try:
                  api.delete_file(path_in_repo='Dockerfile', repo_id='AravKataria/vajra', repo_type='space')
                  print('🗑️ Removed old Dockerfile from AravKataria/vajra!')
              except Exception as del_err:
                  print(f'Note on Dockerfile removal: {del_err}')

              api.upload_folder(
                  folder_path='hf_zerogpu_space',
                  repo_id='AravKataria/vajra',
                  repo_type='space',
                  commit_message='Automated sync: ZeroGPU A10G burst engine with Gradio SDK'
              )
              print('✅ AravKataria/vajra updated successfully!')
          except Exception as e:
              print(f'⚠️ Error updating vajra: {e}')
          "
