name: Multi-Platform Cross-Compilation & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  # ─── 1. RUN PYTEST SUITE ───
  test:
    name: Run Test Suite (Python & Linters)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx httpx2

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

  # ─── 2. BUILD TAURI v2 DESKTOP APPS & NATIVE BINARIES ───
  build:
    name: Build Native Apps (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: vajra-core.exe
            asset_name: vajra-core-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: vajra-core
            asset_name: vajra-core-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: vajra-core
            asset_name: vajra-core-linux-x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux WebKit Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Build core scanner
      - name: Build vajra-core (Rust Standalone Binary)
        run: |
          cargo build --release --manifest-path crates/vajra-core/Cargo.toml

      # Build Tauri v2 native installer (NSIS on Windows, DMG on Mac, AppImage on Linux)
      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name || inputs.tag_name || 'v2.0.0' }}
          releaseDraft: false
          prerelease: false

      # Collect all compiled binaries and installer bundles
      - name: Stage Release Artifacts
        shell: bash
        run: |
          mkdir -p release_assets
          
          # 1. Raw scanner binaries
          if [ -f "crates/vajra-core/target/release/${{ matrix.bin_name }}" ]; then
            cp "crates/vajra-core/target/release/${{ matrix.bin_name }}" "release_assets/${{ matrix.asset_name }}"
          fi

          # 2. Windows NSIS & MSI Installers
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            find src-tauri/target/release/bundle -name "*.exe" -exec cp {} release_assets/VAJRA_x64-setup.exe \; 2>/dev/null || true
            find src-tauri/target/release/bundle -name "*.exe" -exec cp {} release_assets/VAJRA-Setup.exe \; 2>/dev/null || true
            find src-tauri/target/release/bundle -name "*.msi" -exec cp {} release_assets/ \; 2>/dev/null || true
          fi

          # 3. macOS DMG Installers
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            find src-tauri/target/release/bundle -name "*.dmg" -exec cp {} release_assets/VAJRA_aarch64.dmg \; 2>/dev/null || true
            if [ -f "scripts/install.sh" ]; then cp "scripts/install.sh" "release_assets/install.sh"; fi
            if [ -f "scripts/install.ps1" ]; then cp "scripts/install.ps1" "release_assets/install.ps1"; fi
          fi

          # 4. Linux AppImage & DEB
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            find src-tauri/target/release/bundle -name "*.AppImage" -exec cp {} release_assets/VAJRA_amd64.AppImage \; 2>/dev/null || true
            find src-tauri/target/release/bundle -name "*.deb" -exec cp {} release_assets/ \; 2>/dev/null || true
          fi

      - name: Upload Raw Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: release_assets/*

  # ─── 3. PUBLISH GITHUB RELEASE ───
  publish:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_release_assets
          merge-multiple: true

      - name: Attach Assets to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: all_release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
