name: Test Linux (Interactive & Automated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode'
        required: true
        default: 'interactive-web-terminal'
        type: choice
        options:
          - 'interactive-web-terminal'
          - 'automated-test-suite'

jobs:
  test-linux:
    name: Ubuntu Linux Runner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Automated test mode
      - name: Run Automated Installer & Pytest
        if: ${{ inputs.mode == 'automated-test-suite' }}
        run: |
          echo "=== Running scripts/install.sh on Linux ==="
          bash scripts/install.sh
          echo "=== Testing Python Pytest Suite ==="
          pip install -r requirements.txt pytest httpx httpx2
          python -m pytest

      # Interactive mode: ttyd + Cloudflare HTTPS Tunnel (100% firewall proof)
      - name: 🚀 OPEN LIVE LINUX TERMINAL
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        run: |
          echo "=== [1/3] Installing Web Terminal Engine (ttyd) ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq ttyd
          
          echo "=== [2/3] Setting up Cloudflare Tunnel ==="
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          
          echo "=== [3/3] Launching Web Terminal ==="
          ttyd -p 7681 -W -t fontSize=14 bash >/dev/null 2>&1 &
          
          /tmp/cloudflared tunnel --url http://127.0.0.1:7681 > /tmp/cf.log 2>&1 &
          
          CF_URL=""
          for i in $(seq 1 20); do
            CF_URL=$(grep -o 'https://[-a-z0-9.]*\.trycloudflare\.com' /tmp/cf.log | head -n 1 || true)
            if [ -n "$CF_URL" ]; then break; fi
            sleep 1
          done
          
          echo ""
          echo "################################################################################"
          echo "################################################################################"
          echo "##"
          echo "##   🎉 YOUR LIVE LINUX BROWSER TERMINAL IS READY!"
          echo "##"
          echo "##   👉 CLICK THIS LINK TO OPEN IN BROWSER:"
          echo "##"
          echo "##   $CF_URL"
          echo "##"
          echo "################################################################################"
          echo "################################################################################"
          echo ""
          
          # Keep session alive for 30 minutes
          for i in $(seq 1 360); do
            sleep 5
          done
