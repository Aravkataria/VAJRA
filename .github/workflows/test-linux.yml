name: Test Linux (Interactive & Automated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode'
        required: true
        default: 'automated-test-suite'
        type: choice
        options:
          - 'automated-test-suite'
          - 'interactive-web-terminal'

jobs:
  test-linux:
    name: Ubuntu Linux Runner (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Automated test mode: Installs & runs test suite automatically
      - name: Run Automated Installer & Pytest
        if: ${{ inputs.mode == 'automated-test-suite' }}
        run: |
          echo "=== Running scripts/install.sh on Linux ==="
          bash scripts/install.sh
          echo "=== Testing Python Pytest Suite ==="
          pip install -r requirements.txt pytest httpx httpx2
          python -m pytest

      # Interactive mode: Pure native tmate web terminal
      - name: Launch Live Web Terminal
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        run: |
          echo "=== Installing tmate ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmate
          
          echo "=== Starting tmate session ==="
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          # 1. Post directly to GitHub Actions Summary Dashboard
          echo "## 🖥️ Live Linux Web Terminal" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 👉 [Click here to open Live Linux Terminal]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Direct URL:" >> $GITHUB_STEP_SUMMARY
          echo "\`$WEB_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SSH Command: \`$SSH_CMD\`" >> $GITHUB_STEP_SUMMARY
          
          # 2. Print to console logs
          echo "================================================================"
          echo "  WEB TERMINAL URL: $WEB_URL"
          echo "  SSH COMMAND:      $SSH_CMD"
          echo "================================================================"
          
          # Keep terminal alive for 30 minutes
          for i in $(seq 1 360); do
            if [ ! -S /tmp/tmate.sock ]; then break; fi
            sleep 5
          done
