name: Test Linux (Interactive & Automated)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose mode'
        required: true
        default: 'automated-test-suite'
        type: choice
        options:
          - 'automated-test-suite'
          - 'interactive-web-terminal'

jobs:
  test-linux:
    name: Ubuntu Linux Runner (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Automated test mode: Installs & verifies automatically
      - name: Run Automated Installer & Pytest
        if: ${{ inputs.mode == 'automated-test-suite' }}
        run: |
          echo "=== Running scripts/install.sh on Linux ==="
          bash scripts/install.sh
          echo "=== Testing Python Pytest Suite ==="
          pip install -r requirements.txt pytest
          python -m pytest

      # Interactive mode: Generate dummy key so tmate never looks for GitHub profile keys
      - name: Generate Local Runner Key
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 2048 -f ~/.ssh/id_rsa -N "" -q
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys

      - name: Open Interactive Web Terminal
        if: ${{ inputs.mode == 'interactive-web-terminal' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
