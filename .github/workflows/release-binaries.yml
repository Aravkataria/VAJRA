name: Build & Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-suite:
    name: Run Python & AST Test Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/

  build-rust-binaries:
    name: Build Native Rust Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: vajra-core.exe
            release_name: vajra-core-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: vajra-core
            release_name: vajra-core-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: vajra-core
            release_name: vajra-core-linux-x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build vajra-core (Release)
        working-directory: crates/vajra-core
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp crates/vajra-core/target/${{ matrix.target }}/release/vajra-core.exe ${{ matrix.release_name }}
          else
            cp crates/vajra-core/target/${{ matrix.target }}/release/vajra-core ${{ matrix.release_name }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: ${{ matrix.release_name }}

  release:
    name: Create GitHub Release
    needs: [test-suite, build-rust-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
            dist/VAJRA-Setup.exe
            scripts/install.sh
            scripts/install.ps1
          draft: false
          prerelease: false
          generate_release_notes: true
